<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Similaire — trouve des chansons qui y ressemblent</title>
<style>
:root{--bg:#faf7f2;--card:#fff;--ink:#1d1a22;--mute:#6d6877;--line:#e6e0d6;--accent:#e4572e;--chip:#f3ece1}
@media (prefers-color-scheme:dark){:root{--bg:#16141a;--card:#201d27;--ink:#f1eee8;--mute:#9c97a8;--line:#322e3b;--accent:#ff7a4d;--chip:#2b2733}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
main{max-width:760px;margin:0 auto;padding:32px 18px 60px}
h1{font-family:Georgia,serif;font-size:2.2rem;margin:0 0 6px}h1 span{color:var(--accent)}
.sub{color:var(--mute);margin:0 0 24px}
.search{display:flex;gap:10px;flex-wrap:wrap}
input{flex:1 1 220px;padding:14px 16px;font-size:1rem;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
button{padding:14px 22px;font-size:1rem;font-weight:600;border:0;border-radius:12px;background:var(--accent);color:#fff;cursor:pointer}
button:disabled{opacity:.6}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-top:20px}
.card h2{font-size:.8rem;text-transform:uppercase;letter-spacing:1px;color:var(--mute);margin:0 0 12px}
.row{display:flex;gap:14px;align-items:flex-start}
.row img{width:72px;height:72px;border-radius:10px;flex:none;background:var(--chip)}
.k{font-size:.78rem;color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{background:var(--chip);border-radius:99px;padding:3px 10px;font-size:.82rem}
.rec{padding:14px 0;border-top:1px solid var(--line)}.rec:first-of-type{border-top:0}
.rec p{margin:4px 0 6px;color:var(--mute);font-size:.9rem}
.rec a{margin-right:16px;color:var(--accent);font-weight:600;text-decoration:none;font-size:.88rem}
.score{margin-left:auto;font-weight:700;color:var(--accent)}
audio{width:100%;height:32px;margin-top:6px}
.mini{padding:6px 12px;font-size:.8rem;margin:6px 8px 0 0;background:var(--chip);color:var(--ink)}
.fc{cursor:pointer;border:1px solid var(--line)}.fc.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.filters{display:flex;gap:8px;align-items:center;margin-top:14px;font-size:.9rem;color:var(--mute);cursor:pointer}
input[type=checkbox]{flex:none;width:18px;height:18px;padding:0;accent-color:var(--accent)}
.msg{margin-top:20px;color:var(--mute)}
</style>
</head>
<body>
<main>
<h1>Simil<span>aire</span></h1>
<p class="sub">Entre une chanson que tu aimes : on trouve des titres réels qui lui ressemblent (tempo, tonalité, genre, écoutes communes).</p>
<div class="search"><input id="q" placeholder="Ex : Get Lucky Daft Punk" autocomplete="off"><button id="go">Trouver</button></div>
<div class="filters"><span>Popularité :</span><span class="chips" id="nc"></span></div>
<div id="out"></div>
</main>
<script>
const $=id=>document.getElementById(id),out=$('out');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const chips=a=>'<div class="chips">'+(a||[]).map(x=>'<span class="chip">'+esc(x)+'</span>').join('')+'</div>';
const fmt=n=>n>=1e6?(n/1e6).toFixed(1)+' M':n>=1e3?Math.round(n/1e3)+' k':String(n);
const pl=t=>t.plays?fmt(t.plays)+' écoutes':'';
const meta=t=>[t.genre,t.bpm&&t.bpm+' BPM',t.key,pl(t)].filter(Boolean).join(' · ');
let NICHE=0;
$('nc').innerHTML=['Populaires','Découverte','Très niche'].map((x,i)=>'<span class="chip fc'+(i?'':' on')+'" data-v="'+i+'">'+x+'</span>').join('');
$('nc').onclick=e=>{const c=e.target.closest('.fc');if(!c)return;NICHE=+c.dataset.v;document.querySelectorAll('#nc .fc').forEach(x=>x.classList.toggle('on',x===c))};
const links=t=>{const q=encodeURIComponent(t.title+' '+t.artist);return '<a href="https://open.spotify.com/search/'+q+'" target="_blank" rel="noopener">Spotify</a><a href="https://music.youtube.com/search?q='+q+'" target="_blank" rel="noopener">YouTube Music</a>'};
let RUN=0;
async function run(){
  const my=++RUN;
  const q=$('q').value.trim();if(!q)return;
  $('go').disabled=true;out.innerHTML='<p class="msg">Analyse en cours… (10 à 40 secondes)</p>';
  try{
    const r=await fetch('/api/similar?q='+encodeURIComponent(q)+'&niche='+NICHE);
    const d=await r.json();
    if(!r.ok)throw new Error(d.error||'Erreur');
    const s=d.seed;
    let h='<div class="card"><h2>Ta chanson</h2><div class="row"><img src="'+esc(s.cover)+'" alt=""><div><b>'+esc(s.title)+'</b> — '+esc(s.artist)
      +'<div class="k">'+esc(meta(s))+'</div><div class="k" id="dgs"></div>'+(s.accords?'<div class="k">Accords : '+esc(s.accords)+'</div>':'')+chips(s.instruments)
      +(s.preview?'<audio controls preload="none" src="'+esc(s.preview)+'"></audio>':'')+'</div></div></div>'
;
    const rec=(t,i)=>'<div class="rec" id="r'+i+'" data-s="'+t.score+'"><div class="row"><img src="'+esc(t.cover)+'" alt=""><div style="flex:1"><b>'+esc(t.title)+'</b> — '+esc(t.artist)
      +'<div class="k" id="m'+i+'">'+esc(meta(t))+(t.preview?' · analyse du tempo…':'')+'</div><p>Pourquoi : <span id="w'+i+'">'+esc(t.why)+'</span></p><div class="k" id="dg'+i+'"></div>'
      +(t.preview?'<audio controls preload="none" src="'+esc(t.preview)+'"></audio>':'')
      +chips(t.instruments)+(t.accords?'<div class="k">Accords : '+esc(t.accords)+'</div>':'')
      +links(t)+'</div><div class="score" id="s'+i+'">'+t.score+'%</div></div></div>';
    const sec=(title,arr)=>arr.length?'<div class="card"><h2>'+title+'</h2><div>'+arr.map(([t,i])=>rec(t,i)).join('')+'</div></div>':'';
    const idx=d.results.map((t,i)=>[t,i]);
    if(d.notice)h+='<p class="msg">'+esc(d.notice)+'</p>';
    if(!idx.length)h+=sec('Chansons similaires',[])+'<div class="card"><p class="msg">Aucune chanson similaire trouvée. Essaie « titre artiste ».</p></div>';
    else if(d.grouped){
      const a=idx.filter(([t])=>t.same),b=idx.filter(([t])=>!t.same);
      h+=a.length?sec('Avec les mêmes instruments',a):'<div class="card"><h2>Avec les mêmes instruments</h2><p class="msg">Aucune chanson trouvée avec les mêmes instruments.</p></div>';
      h+=sec('Similaires, mais avec d’autres instruments',b);
    }else h+=sec('Chansons similaires',idx);
    out.innerHTML=h;
    enrich(s,d.results,my);
  }catch(e){out.innerHTML='<p class="msg">'+esc(e.message)+'</p>'}
  $('go').disabled=false;
}
let NOD=false;
async function getD(artist,title){
  try{
    const r=await fetch('/api/discogs?artist='+encodeURIComponent(artist)+'&title='+encodeURIComponent(title));
    const d=await r.json();
    if(d.error){if(d.error.includes('DISCOGS_TOKEN'))NOD=true;return null}
    return d;
  }catch(e){return null}
}
const dtxt=d=>'Discogs : '+d.styles.slice(0,4).join(', ')+(d.year?' · '+d.year:'')+(d.have?' · '+fmt(d.have)+' collectionneurs':'');
async function enrich(s,rs,my){
  const sd=await getD(s.artist,s.title);
  if(my!==RUN)return;
  if(sd&&$('dgs'))$('dgs').textContent=dtxt(sd);
  for(let i=0;i<rs.length;i++){
    if(my!==RUN)return;
    const t=rs[i],m=$('m'+i);if(!m)return;
    const pA=t.preview?fetch('/api/analyze?url='+encodeURIComponent(t.preview)+(s.bpm?'&bpm='+s.bpm+'&pc='+s.pc+'&mode='+s.mode:'')).then(r=>r.json().then(j=>[r.ok,j])).catch(()=>[false,{}]):Promise.resolve([false,{}]);
    const pD=NOD?Promise.resolve(null):getD(t.artist,t.title);
    const [[ok,a],d]=await Promise.all([pA,pD]);
    if(my!==RUN)return;
    const x=[],parts=[t.genre];let ts=null,ks=null,sr=null;
    if(ok&&!a.error){
      parts.push(a.bpm+' BPM',a.key);
      if(a.tempo_sim!=null){
        ts=a.tempo_sim;ks=a.key_sim;
        x.push(ts>0.7?'tempo proche ('+a.bpm+' vs '+s.bpm+' BPM)':'tempo différent ('+a.bpm+' vs '+s.bpm+' BPM)');
        x.push(ks>0.7?'tonalité compatible':'tonalité éloignée');
      }
    }
    parts.push(pl(t));
    m.textContent=parts.filter(Boolean).join(' · ');
    if(d&&d.styles&&d.styles.length){
      $('dg'+i).textContent=dtxt(d);
      if(sd&&sd.styles&&sd.styles.length){
        const low=sd.styles.map(z=>z.toLowerCase()),com=d.styles.filter(z=>low.includes(z.toLowerCase()));
        sr=Math.min(1,com.length/Math.max(1,Math.min(2,sd.styles.length)));
        x.push(com.length?'styles Discogs communs : '+com.join(', '):'styles Discogs différents');
      }
    }
    let f=null;
    if(ts!=null)f=sr!=null?0.45*t.score+25*ts+15*ks+15*sr:0.5*t.score+30*ts+20*ks;
    else if(sr!=null)f=0.7*t.score+30*sr;
    if(f!=null){
      f=Math.min(100,Math.round(f));
      $('r'+i).dataset.s=f;$('s'+i).textContent=f+'%';
      const L=$('r'+i).parentNode;[...L.children].sort((p,q)=>q.dataset.s-p.dataset.s).forEach(e=>L.appendChild(e));
    }
    if(x.length)$('w'+i).textContent=t.why+', '+x.join(', ');
  }
}
$('go').onclick=run;$('q').addEventListener('keydown',e=>{if(e.key==='Enter')run()});
</script>
</body>
</html>
