<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Similaire — trouve des chansons qui y ressemblent</title>
<style>
:root{--bg:#faf7f2;--card:#fff;--ink:#1d1a22;--mute:#6d6877;--line:#e6e0d6;--accent:#e4572e;--chip:#f3ece1}
@media (prefers-color-scheme:dark){:root{--bg:#16141a;--card:#201d27;--ink:#f1eee8;--mute:#9c97a8;--line:#322e3b;--accent:#ff7a4d;--chip:#2b2733}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
main{max-width:760px;margin:0 auto;padding:32px 18px 60px}
h1{font-family:Georgia,serif;font-size:2.2rem;margin:0 0 6px}h1 span{color:var(--accent)}
.sub{color:var(--mute);margin:0 0 24px}
.search{display:flex;gap:10px;flex-wrap:wrap}
input{flex:1 1 220px;padding:14px 16px;font-size:1rem;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
button{padding:14px 22px;font-size:1rem;font-weight:600;border:0;border-radius:12px;background:var(--accent);color:#fff;cursor:pointer}
button:disabled{opacity:.6}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-top:20px}
.card h2{font-size:.8rem;text-transform:uppercase;letter-spacing:1px;color:var(--mute);margin:0 0 12px}
.row{display:flex;gap:14px;align-items:flex-start}
.row img{width:72px;height:72px;border-radius:10px;flex:none;background:var(--chip)}
.k{font-size:.78rem;color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{background:var(--chip);border-radius:99px;padding:3px 10px;font-size:.82rem}
.rec{padding:14px 0;border-top:1px solid var(--line)}.rec:first-of-type{border-top:0}
.rec p{margin:4px 0 6px;color:var(--mute);font-size:.9rem}
.rec a{color:var(--accent);font-weight:600;text-decoration:none;font-size:.88rem}
.score{margin-left:auto;font-weight:700;color:var(--accent)}
audio{width:100%;height:32px;margin-top:6px}
.mini{padding:6px 12px;font-size:.8rem;margin:6px 8px 0 0;background:var(--chip);color:var(--ink)}
.msg{margin-top:20px;color:var(--mute)}
</style>
</head>
<body>
<main>
<h1>Simil<span>aire</span></h1>
<p class="sub">Entre une chanson que tu aimes : on trouve des titres réels qui lui ressemblent (tempo, tonalité, genre, écoutes communes).</p>
<div class="search"><input id="q" placeholder="Ex : Get Lucky Daft Punk" autocomplete="off"><button id="go">Trouver</button></div>
<div id="out"></div>
</main>
<script>
const $=id=>document.getElementById(id),out=$('out');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const chips=a=>'<div class="chips">'+(a||[]).map(x=>'<span class="chip">'+esc(x)+'</span>').join('')+'</div>';
const meta=t=>[t.genre,t.bpm&&t.bpm+' BPM',t.key].filter(Boolean).join(' · ');
async function run(){
  const q=$('q').value.trim();if(!q)return;
  $('go').disabled=true;out.innerHTML='<p class="msg">Analyse en cours… (10 à 30 secondes)</p>';
  try{
    const r=await fetch('/api/similar?q='+encodeURIComponent(q));
    const d=await r.json();
    if(!r.ok)throw new Error(d.error||'Erreur');
    const s=d.seed;window.R=d.results;
    let h='<div class="card"><h2>Ta chanson</h2><div class="row"><img src="'+esc(s.cover)+'" alt=""><div><b>'+esc(s.title)+'</b> — '+esc(s.artist)
      +'<div class="k">'+esc(meta(s))+'</div>'+(s.accords?'<div class="k">Accords : '+esc(s.accords)+'</div>':'')+chips(s.instruments)
      +(s.preview?'<audio controls preload="none" src="'+esc(s.preview)+'"></audio>':'')+'</div></div></div>'
      +'<div class="card"><h2>Chansons similaires</h2><div id="list">';
    if(!d.results.length)h+='<p class="msg">Aucune chanson similaire trouvée. Essaie « titre artiste ».</p>';
    d.results.forEach((t,i)=>{
      h+='<div class="rec" id="r'+i+'" data-s="'+t.score+'"><div class="row"><img src="'+esc(t.cover)+'" alt=""><div style="flex:1"><b>'+esc(t.title)+'</b> — '+esc(t.artist)
        +'<div class="k" id="m'+i+'">'+esc(meta(t))+(t.preview?' · analyse du tempo…':'')+'</div><p>Pourquoi : <span id="w'+i+'">'+esc(t.why)+'</span></p>'
        +(t.preview?'<audio controls preload="none" src="'+esc(t.preview)+'"></audio>':'')
        +'<div id="x'+i+'"></div><button class="mini" id="d'+i+'" onclick="desc('+i+')">Accords &amp; instruments</button> '
        +'<a href="'+esc(t.link)+'" target="_blank" rel="noopener">Écouter en entier sur Deezer</a></div><div class="score" id="s'+i+'">'+t.score+'%</div></div></div>';
    });
    out.innerHTML=h+'</div></div>';
    enrich(s,d.results);
  }catch(e){out.innerHTML='<p class="msg">'+esc(e.message)+'</p>'}
  $('go').disabled=false;
}
async function desc(i){
  const t=window.R[i],b=$('d'+i);b.disabled=true;b.textContent='…';
  try{
    const r=await fetch('/api/describe?title='+encodeURIComponent(t.title)+'&artist='+encodeURIComponent(t.artist));
    const a=await r.json();
    $('x'+i).innerHTML=(a.accords||a.instruments)?(a.accords?'<div class="k">Accords : '+esc(a.accords)+'</div>':'')+chips(a.instruments):'<div class="k">Indisponible pour le moment.</div>';
    b.remove();
  }catch(e){b.disabled=false;b.textContent='Réessayer'}
}
async function enrich(s,rs){
  for(let i=0;i<rs.length;i++){
    const t=rs[i],m=$('m'+i);if(!m)return;
    if(!t.preview)continue;
    try{
      const r=await fetch('/api/analyze?url='+encodeURIComponent(t.preview)+(s.bpm?'&bpm='+s.bpm+'&pc='+s.pc+'&mode='+s.mode:''));
      const a=await r.json();
      if(!r.ok||a.error){m.textContent=meta(t);continue}
      m.textContent=[t.genre,a.bpm+' BPM',a.key].filter(Boolean).join(' · ');
      const x=[];
      if(a.tempo_sim!=null){
        x.push(a.tempo_sim>0.7?'tempo proche ('+a.bpm+' vs '+s.bpm+' BPM)':'tempo différent ('+a.bpm+' vs '+s.bpm+' BPM)');
        x.push(a.key_sim>0.7?'tonalité compatible':'tonalité éloignée');
        const f=Math.round(0.5*t.score+30*a.tempo_sim+20*a.key_sim);
        $('r'+i).dataset.s=f;$('s'+i).textContent=f+'%';
        const L=$('list');[...L.children].sort((p,q)=>q.dataset.s-p.dataset.s).forEach(e=>L.appendChild(e));
      }
      if(x.length)$('w'+i).textContent+=', '+x.join(', ');
    }catch(e){m.textContent=meta(t)}
  }
}
$('go').onclick=run;$('q').addEventListener('keydown',e=>{if(e.key==='Enter')run()});
</script>
</body>
</html>
